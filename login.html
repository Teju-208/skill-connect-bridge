<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SkillBridge</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="auth-page">

    <div class="auth-box">


        <div class="auth-logo">
            Skill<span style="color:#222;">Bridge</span>
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="auth-description">
            Login to continue your
            SkillBridge journey.
        </p>


        <!-- LOGIN ROLE -->

        <label>
            Login As
        </label>

        <select id="loginRole" required>

            <option value="student">
                Student
            </option>

            <option value="faculty">
                Faculty
            </option>

            <option value="university">
                University
            </option>

            <option value="industry">
                Industry
            </option>

        </select>


        <!-- LOGIN FORM -->

        <form onsubmit="loginUser(event)">


            <label>
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="auth-submit"
            >
                Login
            </button>


        </form>


        <div class="auth-bottom">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>


        <div class="auth-bottom">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>


    </div>

</div>


<script src="script.js"></script>

</body>

</html>
