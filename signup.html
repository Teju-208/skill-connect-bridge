<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | SkillBridge</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="auth-page">

    <div class="auth-box">


        <div class="auth-logo">
            Skill<span style="color:#222;">Bridge</span>
        </div>


        <h1>
            Create Your Account
        </h1>


        <p class="auth-description">

            Start building your future
            with SkillBridge.

        </p>


        <form onsubmit="createAccount(event)">


            <!-- ROLE -->

            <label>
                Create Account As
            </label>

            <select id="signupRole" required>

                <option value="student">
                    Student
                </option>

                <option value="faculty">
                    Faculty
                </option>

                <option value="university">
                    University
                </option>

                <option value="industry">
                    Industry
                </option>

            </select>


            <!-- NAME -->

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your name"
                required
            >


            <!-- EMAIL -->

            <label>
                Email
            </label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label>
                Password
            </label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                required
            >


            <!-- SUBMIT -->

            <button
                type="submit"
                class="auth-submit"
            >
                Create Account
            </button>


        </form>


        <div class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <div class="auth-bottom">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>


    </div>

</div>


<script src="script.js"></script>

</body>

</html>
